<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸福镇 - NPC大脑决策系统演示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      font-family: 'Microsoft YaHei', system-ui, sans-serif;
      overflow: hidden;
    }
    
    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }
    
    /* 左侧地图区域 */
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0f0f1a;
    }
    
    #game-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
    }
    
    #game-canvas:active {
      cursor: grabbing;
    }
    
    /* 地图控制提示 */
    #map-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
    }
    
    #map-controls kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    
    /* 右侧信息栏 */
    #sidebar {
      width: 320px;
      background: #16213e;
      border-left: 2px solid #0f3460;
      display: flex;
      flex-direction: column;
      color: #e94560;
    }
    
    #sidebar-header {
      padding: 15px;
      background: #0f3460;
      border-bottom: 2px solid #e94560;
    }
    
    #sidebar-header h1 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 5px;
    }
    
    #sidebar-header p {
      font-size: 12px;
      color: #aaa;
    }
    
    /* NPC列表 */
    #npc-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .npc-card {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    
    .npc-card:hover {
      border-color: #e94560;
      background: #1f1f3a;
    }
    
    .npc-card.active {
      border-color: #e94560;
      background: #2a1a3e;
    }
    
    .npc-name {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }
    
    .npc-position {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .npc-action {
      font-size: 12px;
      color: #e94560;
      background: rgba(233, 69, 96, 0.1);
      padding: 5px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    
    .npc-traits {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    
    .trait-tag {
      font-size: 10px;
      background: #0f3460;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    /* 底部控制区 */
    #sidebar-footer {
      padding: 15px;
      background: #0f0f1a;
      border-top: 1px solid #0f3460;
    }
    
    .control-group {
      margin-bottom: 10px;
    }
    
    .control-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }
    
    .btn {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: #e94560;
    }
    
    .btn.active {
      background: #e94560;
    }
    
    /* 缩放指示器 */
    #zoom-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    /* 滚动条样式 */
    #npc-list::-webkit-scrollbar {
      width: 6px;
    }
    
    #npc-list::-webkit-scrollbar-track {
      background: #0f0f1a;
    }
    
    #npc-list::-webkit-scrollbar-thumb {
      background: #0f3460;
      border-radius: 3px;
    }
    
    #npc-list::-webkit-scrollbar-thumb:hover {
      background: #e94560;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 地图区域 -->
    <div id="map-container">
      <canvas id="game-canvas"></canvas>
      <div id="zoom-indicator">缩放: 100%</div>
      <div id="map-controls">
        <div><kbd>WASD</kbd> 移动角色</div>
        <div><kbd>鼠标拖动</kbd> 移动视角</div>
        <div><kbd>Ctrl</kbd> + <kbd>滚轮</kbd> 缩放地图</div>
        <div><kbd>空格</kbd> 重置视角</div>
      </div>
    </div>
    
    <!-- 侧边栏 -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>🏘️ 幸福镇</h1>
        <p>NPC大脑决策系统实时监控</p>
      </div>
      
      <div id="npc-list">
        <!-- NPC卡片将在这里动态生成 -->
      </div>
      
      <div id="sidebar-footer">
        <div class="control-group">
          <label>⏰ 游戏时间</label>
          <div id="time-display" style="font-size: 24px; color: #fff; margin-bottom: 10px;">
            <span id="game-time">08:00</span>
            <span id="game-day" style="font-size: 12px; color: #888;"> 第1天</span>
          </div>
          <div id="day-phase" style="font-size: 12px; color: #aaa; margin-bottom: 10px;">
            🌅 白天
          </div>
        </div>
        <div class="control-group">
          <label>时间流速</label>
          <button class="btn active" id="btn-speed-1x">1x</button>
          <button class="btn" id="btn-speed-10x">10x</button>
          <button class="btn" id="btn-speed-50x">50x</button>
          <button class="btn" id="btn-speed-max">MAX</button>
          <button class="btn" id="btn-speed-pause">⏸</button>
        </div>
        <div class="control-group">
          <label>快速跳转</label>
          <button class="btn" id="btn-dawn">黎明</button>
          <button class="btn" id="btn-morning">上午</button>
          <button class="btn" id="btn-noon">中午</button>
          <button class="btn" id="btn-evening">傍晚</button>
          <button class="btn" id="btn-next-day">次日8点</button>
        </div>
        <div class="control-group">
          <label>天气控制 <span id="current-weather" style="color:#e94560;">☀️ 晴天</span></label>
          <div id="weather-controls" style="display:flex;flex-wrap:wrap;gap:5px;">
            <button class="btn" id="btn-weather-clear">☀️ 晴天</button>
            <button class="btn" id="btn-weather-rain">🌧️ 雨天</button>
            <button class="btn" id="btn-weather-snow">❄️ 雪天</button>
            <button class="btn" id="btn-weather-fog">🌫️ 雾天</button>
            <button class="btn" id="btn-weather-cloudy">☁️ 阴天</button>
            <button class="btn" id="btn-weather-thunderstorm">⛈️ 雷暴</button>
            <button class="btn" id="btn-weather-sandstorm">🌪️ 沙尘</button>
            <button class="btn" id="btn-weather-rainbow">🌈 彩虹</button>
            <button class="btn" id="btn-weather-dusk_glow">🌅 晚霞</button>
            <button class="btn" id="btn-weather-windy">💨 大风</button>
          </div>
        </div>
        <div class="control-group">
          <label>视图控制</label>
          <button class="btn" id="btn-reset-view">重置视角</button>
          <button class="btn" id="btn-full-map">查看全貌</button>
        </div>
        <div class="control-group">
          <label>移动画面</label>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <button class="btn" id="btn-cam-up" style="width:40px;height:32px;padding:0;">▲</button>
            <div style="display:flex;gap:4px;">
              <button class="btn" id="btn-cam-left" style="width:40px;height:32px;padding:0;">◀</button>
              <button class="btn" id="btn-cam-down" style="width:40px;height:32px;padding:0;">▼</button>
              <button class="btn" id="btn-cam-right" style="width:40px;height:32px;padding:0;">▶</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
